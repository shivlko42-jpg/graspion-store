name: Generate Product Pages

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — catches new/updated products automatically
  workflow_dispatch: {}      # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate product pages + sitemap
        run: node generate-product-pages.js

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-update product pages and sitemap"
          git push
