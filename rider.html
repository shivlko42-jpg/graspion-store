<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graspion Rider App</title>
<link rel="manifest" href="manifest-rider.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Graspion Rider">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="graspion-logo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Noto Sans Devanagari',system-ui,sans-serif; }
body { background:#0f1117; color:#fff; max-width:420px; margin:0 auto; min-height:100vh; }
.login-overlay { position:fixed; inset:0; background:#0f1117; z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-box { background:#181b25; border-radius:20px; padding:30px 24px; max-width:360px; width:100%; text-align:center; }
.login-select, .login-btn { width:100%; padding:13px; border-radius:12px; font-size:14px; margin-bottom:12px; }
.login-select { background:#0f1117; color:#fff; border:1px solid #333; }
.login-btn { background:linear-gradient(90deg,#7c3aed,#ec4899); border:none; color:#fff; font-weight:800; cursor:pointer; }
.login-error { color:#f87171; font-size:11px; margin-bottom:10px; min-height:14px; }
.app-wrap { display:none; }
.app-wrap.active { display:block; }
.topbar { padding:16px 18px; display:flex; justify-content:space-between; align-items:center; }
.rider-info { display:flex; align-items:center; gap:10px; }
.rider-avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#ec4899); display:flex; align-items:center; justify-content:center; font-size:16px; }
.rider-name { font-size:14px; font-weight:800; }
.rider-bike { font-size:10px; color:#94a3b8; }
.logout { background:#262a38; color:#fca5a5; border:none; padding:8px 14px; border-radius:9px; font-size:11px; font-weight:700; }

.earnings-card { margin:0 18px 16px; background:linear-gradient(135deg,#7c3aed,#ec4899); border-radius:16px; padding:18px; }
.earnings-row { display:flex; justify-content:space-between; }
.earnings-item { text-align:center; flex:1; }
.earnings-val { font-size:18px; font-weight:900; }
.earnings-label { font-size:9.5px; opacity:0.9; margin-top:2px; }

.section-label { padding:0 18px 10px; font-size:11px; color:#64748b; font-weight:700; }
.order-card { margin:0 18px 14px; background:#181b25; border-radius:16px; padding:16px; }
.order-top { display:flex; justify-content:space-between; margin-bottom:8px; }
.order-id { font-size:12px; font-weight:800; color:#a78bfa; }
.order-amt { font-size:14px; font-weight:900; }
.order-addr { font-size:12px; color:#94a3b8; margin-bottom:10px; }
.pay-tag { font-size:9px; font-weight:800; padding:3px 8px; border-radius:7px; display:inline-block; margin-bottom:8px; }
.pay-cod { background:#fef3c7; color:#b45309; }
.pay-online { background:#dcfce7; color:#15803d; }
.cod-input { width:100%; padding:9px; border-radius:8px; border:1px solid #333; background:#0f1117; color:#fff; font-size:12px; margin-bottom:8px; display:none; }
.action-btn { width:100%; padding:11px; border-radius:10px; border:none; font-weight:800; font-size:12.5px; cursor:pointer; background:linear-gradient(90deg,#7c3aed,#ec4899); color:#fff; }
.empty { text-align:center; padding:40px; color:#64748b; font-size:13px; }
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
<div class="login-box">
<div data-graspion-logo="full" data-size="20" data-color="#ffffff" style="justify-content:center; display:flex; margin-bottom:16px;"></div>
<input type="email" class="login-select" id="riderEmail" placeholder="Email" autocomplete="username">
<input type="password" class="login-select" id="riderPass" placeholder="Password" autocomplete="current-password">
<button class="login-btn" id="loginBtn">Start Delivering →</button>
<div class="login-error" id="loginError"></div>
<div style="margin-top:14px; font-size:11.5px; color:#9ca3af;">New rider? <span id="openRiderApplyBtn" style="color:#a78bfa; text-decoration:underline; cursor:pointer;">Apply here</span></div>
</div>
</div>

<div class="modal-overlay" id="riderApplyModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:300; align-items:center; justify-content:center; padding:20px;">
<div style="max-width:380px; width:100%; background:#181b25; border-radius:20px; padding:24px; max-height:85vh; overflow-y:auto; color:#fff;">
<h3 style="margin-bottom:4px;">🚴 Apply to Become a Rider</h3>
<p style="font-size:11px; color:#9ca3af; margin-bottom:14px;">Our team will review your application and email you your login once approved.</p>
<input id="rAppName" placeholder="Your full name" style="width:100%; padding:11px; margin-bottom:8px; border-radius:10px; border:1px solid #333; background:#0f1117; color:#fff;">
<input id="rAppEmail" type="email" placeholder="Email" style="width:100%; padding:11px; margin-bottom:8px; border-radius:10px; border:1px solid #333; background:#0f1117; color:#fff;">
<input id="rAppPhone" placeholder="Phone number" style="width:100%; padding:11px; margin-bottom:8px; border-radius:10px; border:1px solid #333; background:#0f1117; color:#fff;">
<input id="rAppBike" placeholder="Bike number (optional)" style="width:100%; padding:11px; margin-bottom:8px; border-radius:10px; border:1px solid #333; background:#0f1117; color:#fff;">
<input id="rAppPincode" placeholder="Your area pincode" style="width:100%; padding:11px; margin-bottom:8px; border-radius:10px; border:1px solid #333; background:#0f1117; color:#fff;">
<div id="riderApplyError" style="color:#f87171; font-size:11px; margin-bottom:8px;"></div>
<button id="submitRiderAppBtn" class="login-btn" style="width:100%;">Submit Application</button>
<button id="closeRiderApplyBtn" style="width:100%; background:none; border:none; color:#9ca3af; padding:10px; margin-top:4px; cursor:pointer;">Cancel</button>
</div>
</div>

<div class="app-wrap" id="appWrap">
<div class="topbar">
<div class="rider-info">
<div class="rider-avatar">🧑</div>
<div><div class="rider-name" id="riderNameLabel"></div><div class="rider-bike" id="riderBikeLabel"></div></div>
</div>
<button class="logout" id="logoutBtn">Logout</button>
</div>

<div class="earnings-card">
<div class="earnings-row">
<div class="earnings-item"><div class="earnings-val" id="totalDeliveries">0</div><div class="earnings-label">Deliveries Today</div></div>
<div class="earnings-item"><div class="earnings-val" id="deliveryEarnings">₹0</div><div class="earnings-label">Earnings</div></div>
<div class="earnings-item"><div class="earnings-val" id="codCollected">₹0</div><div class="earnings-label">COD Collected</div></div>
</div>
</div>

<div class="section-label">🚴 ORDERS TO DELIVER</div>
<div id="orderList"></div>
</div>

<script>
const SUPABASE_URL = 'https://fghhbmdgelnpirysbusl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nuTN31ISqVeDBFDrCiWf-g_MQWA4Fs4';
const supaAuth = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let authToken = SUPABASE_KEY;
let currentRider = null;

async function loginAsRider(session) {
  authToken = session.access_token;
  const res = await fetch(SUPABASE_URL + '/rest/v1/riders?auth_user_id=eq.' + session.user.id + '&select=*', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + authToken }
  });
  const rows = await res.json();
  if (!rows[0]) {
    document.getElementById('loginError').textContent = 'This account is not linked to a rider profile. Contact admin.';
    await supaAuth.auth.signOut();
    authToken = SUPABASE_KEY;
    return false;
  }
  currentRider = rows[0];
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appWrap').classList.add('active');
  document.getElementById('riderNameLabel').textContent = '👋 ' + currentRider.name;
  document.getElementById('riderBikeLabel').textContent = '🏍️ ' + (currentRider.bike_number || 'No bike registered');
  loadOrders();
  return true;
}

(async function restoreRiderSession() {
  try {
    const { data } = await supaAuth.auth.getSession();
    if (data.session) { await loginAsRider(data.session); }
  } catch (err) { /* show login screen as normal */ }
})();

document.getElementById('loginBtn').addEventListener('click', async function() {
  const email = document.getElementById('riderEmail').value.trim();
  const pass = document.getElementById('riderPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Please enter email and password'; return; }
  const btn = document.getElementById('loginBtn');
  btn.textContent = '⏳ Logging in...';
  btn.disabled = true;
  try {
    const { data, error } = await supaAuth.auth.signInWithPassword({ email: email, password: pass });
    if (error || !data.session) {
      errEl.textContent = 'Login failed: ' + (error ? error.message : 'Unknown error');
      btn.textContent = 'Start Delivering →'; btn.disabled = false;
      return;
    }
    const ok = await loginAsRider(data.session);
    if (!ok) { btn.textContent = 'Start Delivering →'; btn.disabled = false; }
  } catch (err) {
    errEl.textContent = 'Login error: ' + err.message;
    btn.textContent = 'Start Delivering →'; btn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', async function() {
  await supaAuth.auth.signOut();
  authToken = SUPABASE_KEY;
  currentRider = null;
  document.getElementById('appWrap').classList.remove('active');
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('riderEmail').value = '';
  document.getElementById('riderPass').value = '';
});

async function loadOrders() {
  const list = document.getElementById('orderList');
  try {
    // Active orders for this rider (in progress)
    const activeRes = await fetch(SUPABASE_URL + '/rest/v1/orders?rider_id=eq.' + currentRider.id + '&status=eq.shipped&select=*', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + authToken }
    });
    const activeOrders = await activeRes.json();

    // New orders available for this rider, not yet assigned
    // Instant (dark store) orders match by warehouse; standard (pan-India) orders fall back to pincode
    let newOrders = [];
    if (currentRider.warehouse_id) {
      const instantRes = await fetch(SUPABASE_URL + '/rest/v1/orders?warehouse_id=eq.' + currentRider.warehouse_id + '&status=eq.preparing&rider_id=is.null&select=*', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + authToken }
      });
      newOrders = await instantRes.json();
    }
    if (currentRider.pincode) {
      const standardRes = await fetch(SUPABASE_URL + '/rest/v1/orders?pincode=eq.' + currentRider.pincode + '&status=eq.preparing&rider_id=is.null&delivery_type=eq.standard&select=*', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + authToken }
      });
      const standardOrders = await standardRes.json();
      // avoid duplicates if an order already matched by warehouse
      standardOrders.forEach(function(o) { if (!newOrders.find(function(x){ return x.id === o.id; })) newOrders.push(o); });
    }

    // Today's delivered orders for earnings
    const deliveredRes = await fetch(SUPABASE_URL + '/rest/v1/orders?rider_id=eq.' + currentRider.id + '&status=eq.delivered&select=*', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + authToken }
    });
    const delivered = await deliveredRes.json();

    const todayStr = new Date().toDateString();
    const todaysDeliveries = delivered.filter(function(o) { return o.delivered_at && new Date(o.delivered_at).toDateString() === todayStr; });
    document.getElementById('totalDeliveries').textContent = todaysDeliveries.length;
    document.getElementById('deliveryEarnings').textContent = '₹' + (todaysDeliveries.length * (currentRider.per_delivery_fee || 25));
    const codTotal = todaysDeliveries.reduce(function(s, o) { return s + Number(o.cod_collected || 0); }, 0);
    document.getElementById('codCollected').textContent = '₹' + codTotal;

    const allOrders = activeOrders.concat(newOrders);

    if (allOrders.length === 0) {
      list.innerHTML = '<div class="empty">No orders to deliver in your area right now 🎉</div>';
      return;
    }

    list.innerHTML = allOrders.map(function(o) {
      const isAssigned = o.status === 'shipped';
      const isCOD = o.payment_status !== 'paid';
      const deliveryBadge = o.delivery_type === 'standard' ? '📦 Pan-India' : '⚡ Instant';
      return '<div class="order-card">' +
        '<div class="order-top"><span class="order-id">#' + o.id.slice(0,8) + ' · ' + deliveryBadge + '</span><span class="order-amt">₹' + o.total_amount + '</span></div>' +
        '<span class="pay-tag ' + (isCOD ? 'pay-cod' : 'pay-online') + '">' + (isCOD ? '💵 Collect COD' : '✅ Already Paid Online') + '</span>' +
        '<div class="order-addr">' + (o.customer_name || 'Customer') + ' · ' + (o.customer_phone || '') + '<br>' + (o.address || '') + '</div>' +
        (isCOD && isAssigned ? '<input type="number" class="cod-input" id="cod-' + o.id + '" placeholder="Enter amount collected (₹' + o.total_amount + ')" style="display:block;">' : '') +
        '<button class="action-btn" data-id="' + o.id + '" data-assigned="' + isAssigned + '" data-cod="' + isCOD + '">' +
          (isAssigned ? 'Mark Delivered' : 'Accept & Pick Up') +
        '</button>' +
      '</div>';
    }).join('');

    document.querySelectorAll('[data-id]').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        const id = btn.getAttribute('data-id');
        const isAssigned = btn.getAttribute('data-assigned') === 'true';
        const isCOD = btn.getAttribute('data-cod') === 'true';

        if (!isAssigned) {
          btn.textContent = '⏳';
          await fetch(SUPABASE_URL + '/rest/v1/orders?id=eq.' + id, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'shipped', rider_id: currentRider.id })
          });
          loadOrders();
        } else {
          const codInput = document.getElementById('cod-' + id);
          const codAmount = codInput ? Number(codInput.value) || 0 : 0;
          if (isCOD && codAmount === 0) {
            alert('Please enter the cash amount collected before marking as delivered');
            return;
          }
          btn.textContent = '⏳';
          const deadline = new Date(); deadline.setDate(deadline.getDate() + 7);
          await fetch(SUPABASE_URL + '/rest/v1/orders?id=eq.' + id, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'delivered', delivered_at: new Date().toISOString(), return_deadline: deadline.toISOString(), cod_collected: codAmount, payment_status: 'paid' })
          });
          fetch(SUPABASE_URL + '/rest/v1/notifications', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ recipient_type: 'customer', channel: 'sms', template_key: 'order_delivered', payload: { order_id: id }, status: 'pending' })
          });
          loadOrders();
        }
      });
    });
  } catch (err) {
    list.innerHTML = '<div class="empty">Error loading orders</div>';
  }
}

// rider list dropdown no longer needed — login is via real email/password now
document.getElementById('openRiderApplyBtn').addEventListener('click', function(){ document.getElementById('riderApplyModal').style.display = 'flex'; });
document.getElementById('closeRiderApplyBtn').addEventListener('click', function(){ document.getElementById('riderApplyModal').style.display = 'none'; });
document.getElementById('submitRiderAppBtn').addEventListener('click', async function(){
const name = document.getElementById('rAppName').value.trim();
const email = document.getElementById('rAppEmail').value.trim();
const phone = document.getElementById('rAppPhone').value.trim();
const errEl = document.getElementById('riderApplyError');
errEl.textContent = '';
if (!name || !email || !phone) { errEl.textContent = 'Please fill in name, email and phone.'; return; }
const btn = document.getElementById('submitRiderAppBtn');
btn.textContent = '⏳ Submitting...';
btn.disabled = true;
try {
const res = await fetch(SUPABASE_URL + '/rest/v1/rider_applications', {
method: 'POST',
headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
body: JSON.stringify({
name: name, email: email, phone: phone,
bike_number: document.getElementById('rAppBike').value.trim() || null,
pincode: document.getElementById('rAppPincode').value.trim() || null,
status: 'pending'
})
});
if (!res.ok) {
const errText = await res.text();
errEl.textContent = 'Could not submit: ' + errText;
btn.textContent = 'Submit Application'; btn.disabled = false;
return;
}
document.getElementById('riderApplyModal').innerHTML = '<div style="max-width:340px; width:100%; background:#181b25; border-radius:20px; padding:30px; text-align:center; color:#fff;"><div style="font-size:48px; margin-bottom:10px;">✅</div><h3>Application Submitted!</h3><p style="font-size:12px; color:#9ca3af; margin-top:8px;">Our team will review it and email you your login details once approved.</p><button onclick="document.getElementById(\'riderApplyModal\').style.display=\'none\';" class="login-btn" style="margin-top:16px;">Close</button></div>';
} catch (err) {
errEl.textContent = 'Network error: ' + err.message;
btn.textContent = 'Submit Application'; btn.disabled = false;
}
});
if ('serviceWorker' in navigator) {
window.addEventListener('load', function() {
navigator.serviceWorker.register('service-worker.js').catch(function(){});
});
}
</script>

</body>
</html>
